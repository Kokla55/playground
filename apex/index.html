<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<title>Apex GT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0a0c10;color:#e8edf2;
  font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  -webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%}

#hud{position:fixed;inset:0;pointer-events:none;z-index:2;
  font-variant-numeric:tabular-nums;opacity:0;transition:opacity .6s ease}
#hud.ready{opacity:1}

/* --- fartsmåler nede til høyre --- */
#hud-gauge{position:absolute;right:26px;bottom:24px;display:flex;align-items:flex-end;gap:14px}
#hud-speed-block{display:flex;align-items:baseline;gap:7px;
  text-shadow:0 2px 18px rgba(0,0,0,.75)}
#hud-speed{font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:600;
  font-size:78px;line-height:.82;letter-spacing:-.02em}
#hud-unit{font-size:12px;letter-spacing:.22em;color:#8d99a8;padding-bottom:6px}
#hud-gear{font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:600;
  font-size:52px;line-height:.9;width:52px;text-align:center;color:#6ee7ff;
  border:1px solid rgba(110,231,255,.32);border-radius:8px;padding:4px 0 2px;
  background:rgba(9,14,22,.5);transition:color .12s,border-color .12s}
#hud-gear.shifting{color:#ffb648;border-color:rgba(255,182,72,.5)}

/* --- turteller --- */
#hud-rpm{position:absolute;right:26px;bottom:122px;width:340px}
#hud-rpm-track{position:relative;height:7px;border-radius:4px;overflow:hidden;
  background:rgba(232,237,242,.13)}
#hud-rpm-fill{position:absolute;inset:0;transform-origin:left center;transform:scaleX(0);
  background:linear-gradient(90deg,#6ee7ff,#54f0b8 62%,#ffd166 86%,#ff5470);
  transition:background .15s}
#hud-rpm-fill.limiter{background:#ff5470}
#hud-rpm-ticks{position:relative;height:9px;margin-top:3px}
#hud-rpm-ticks .tick{position:absolute;top:0;width:1px;height:5px;background:rgba(232,237,242,.3)}
#hud-rpm-ticks .tick.red{background:rgba(255,84,112,.75);height:9px}
#hud-rpm-label{display:flex;justify-content:space-between;margin-top:4px;
  font-size:10px;letter-spacing:.16em;color:#7e8b9b}

/* --- telemetri oppe til venstre --- */
#hud-tel{position:absolute;left:24px;top:22px;display:grid;grid-template-columns:auto auto;
  gap:3px 16px;font-size:11px;letter-spacing:.05em;
  background:rgba(9,13,20,.52);border:1px solid rgba(232,237,242,.08);
  border-radius:8px;padding:12px 16px}
#hud-tel dt{color:#7e8b9b;letter-spacing:.13em;font-size:10px}
#hud-tel dd{color:#e8edf2;text-align:right}

/* --- taster oppe til høyre --- */
#hud-keys{position:absolute;right:24px;top:22px;text-align:right;font-size:10px;
  line-height:1.9;letter-spacing:.09em;color:#69768a}
#hud-keys b{color:#9fb0c4;font-weight:500}

#overlay{position:fixed;inset:0;z-index:3;display:grid;place-items:center;
  background:#0a0c10;transition:opacity .5s ease}
#overlay.gone{opacity:0;pointer-events:none}
#overlay .inner{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
#overlay h1{font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:600;
  font-size:clamp(2.4rem,8vmin,4rem);letter-spacing:.3em;text-indent:.3em;color:#e8edf2}
#overlay p{font-size:12px;letter-spacing:.2em;color:#69768a}
#overlay .bar{width:190px;height:2px;background:rgba(232,237,242,.12);overflow:hidden;border-radius:2px}
#overlay .bar i{display:block;height:100%;width:40%;background:#6ee7ff;
  animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}
#overlay.failed .bar{display:none}
#overlay .err{font-size:11px;color:#ff8fa3;max-width:44ch;line-height:1.7;letter-spacing:.04em}

#pause{position:fixed;inset:0;z-index:4;display:none;place-items:center;
  background:rgba(10,12,16,.78)}
#pause.on{display:grid}
#pause h2{font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:600;
  font-size:2.2rem;letter-spacing:.3em;text-indent:.3em}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud">
  <div id="hud-tel">
    <dt>UNDERLAG</dt><dd id="hud-surface">asphalt</dd>
    <dt>SLIP F/B</dt><dd id="hud-grip">0% / 0%</dd>
    <dt>G LANG/SIDE</dt><dd id="hud-gforce">+0.00 / +0.00</dd>
    <dt>HJUL PÅ BAKKEN</dt><dd id="hud-wheels">4/4</dd>
    <dt>FPS</dt><dd id="hud-fps">0</dd>
  </div>

  <div id="hud-keys">
    <b>W</b> gass &middot; <b>S</b> brems/revers<br>
    <b>A</b> <b>D</b> styring &middot; <b>MELLOMROM</b> håndbrekk<br>
    <b>C</b> kamera &middot; <b>R</b> reset &middot; <b>ESC</b> pause
  </div>

  <div id="hud-rpm">
    <div id="hud-rpm-track"><div id="hud-rpm-fill"></div></div>
    <div id="hud-rpm-ticks"></div>
    <div id="hud-rpm-label"><span>TURTALL</span><span><b id="hud-rpm-value">900</b> RPM</span></div>
  </div>

  <div id="hud-gauge">
    <div id="hud-speed-block">
      <span id="hud-speed">0</span>
      <span id="hud-unit">KM/T</span>
    </div>
    <div id="hud-gear">1</div>
  </div>
</div>

<div id="pause"><h2>PAUSE</h2></div>

<div id="overlay">
  <div class="inner">
    <h1>APEX GT</h1>
    <p id="overlay-status">LASTER FYSIKK</p>
    <div class="bar"><i></i></div>
    <p class="err" id="overlay-error"></p>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
