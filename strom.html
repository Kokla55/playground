<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c2620f">
<meta name="mobile-web-app-capable" content="yes">
<title>Strømavlesning Garasjen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Chivo+Mono:wght@500;700&display=swap">
<style>
/* Layout: én smal kolonne, tre målerkort som ligner telleverk, sendeknapper nederst */
:root{
  --bg:#eceeed; --card:#fbfbfa; --fg:#1d2422; --muted:#5d6865; --line:#d3d8d6;
  --accent:#c2620f; --accent-fg:#fff; --dial:#232a28; --dial-fg:#f3b25a;
  --ui:"Figtree",system-ui,sans-serif; --num:"Chivo Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151a19; --card:#1e2523; --fg:#e7ecea; --muted:#9aa6a2; --line:#2f3936;
  --accent:#e8873a; --accent-fg:#1a1208; --dial:#0d1110; --dial-fg:#f5b866; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151a19; --card:#1e2523; --fg:#e7ecea; --muted:#9aa6a2; --line:#2f3936;
  --accent:#e8873a; --accent-fg:#1a1208; --dial:#0d1110; --dial-fg:#f5b866; color-scheme:dark}
*{box-sizing:border-box}html{color-scheme:light}body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
main{max-width:460px;margin:0 auto;display:grid;gap:18px}
h1{font-size:1.5rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:.95rem}
.meters{display:grid;gap:12px}
.meter{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px}
.meter label{font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meter input{font-family:var(--num);font-size:1.9rem;font-weight:700;letter-spacing:.06em;
  background:var(--dial);color:var(--dial-fg);border:0;border-radius:8px;padding:10px 12px;width:100%;box-sizing:border-box;
  font-variant-numeric:tabular-nums}
.meter input::placeholder{color:color-mix(in srgb,var(--dial-fg) 35%,transparent)}
.meter input:focus{outline:3px solid var(--accent);outline-offset:2px}
.prev{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.prev b{color:var(--fg)}
.preview{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;white-space:pre-wrap;font-size:.95rem;min-height:1.4em}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
button,.btn{font:600 1rem var(--ui);border-radius:10px;padding:14px 10px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);text-align:center;text-decoration:none;display:block}
.btn.primary{grid-column:1/-1;background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-size:1.1rem}
button:focus-visible,.btn:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.status{font-size:.9rem;color:var(--muted);min-height:1.2em;margin:0}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
summary{cursor:pointer;font-weight:600}
.set{display:grid;gap:10px;margin-top:10px}
.set label{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
.set input{font:1rem var(--ui);padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<main>
  <header>
    <h1>Strømavlesning</h1>
    <p class="sub">Tast inn de tre målerne i garasjen og send til Asbjørn.</p>
  </header>

  <section class="meters" id="meters"></section>

  <div>
    <p class="sub" style="margin:0 0 6px">Meldingen som sendes:</p>
    <div class="preview" id="preview"></div>
  </div>

  <div class="actions">
    <a class="btn primary" id="mail" href="#">Send e-post</a>
    <a class="btn" id="gweb" href="#" target="_blank" rel="noopener">Gmail på PC</a>
    <a class="btn" id="sms" href="#">Send SMS</a>
    <button id="copy">Kopier tekst</button>
  </div>
  <p class="status" id="status" role="status"></p>

  <details id="settings">
    <summary>Innstillinger</summary>
    <div class="set">
      <label for="phone">Asbjørns mobilnummer<input id="phone" type="tel" inputmode="tel" placeholder="12345678"></label>
      <label for="email">Asbjørns e-post<input id="email" type="email" placeholder="asbjorn@eksempel.no"></label>
      <label for="sign">Signatur<input id="sign" type="text" value="Philip"></label>
      <button id="reset" type="button">Nullstill forrige avlesning</button>
    </div>
  </details>
</main>

<script>
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const $=id=>document.getElementById(id);
let last=store.get("last",null); // {date, vals:[...]}
const metersEl=$("meters");
const NAMES=["Hovedmåler","Elbil","Moddi"];
for(let i=1;i<=3;i++){
  const d=document.createElement("div");d.className="meter";
  d.innerHTML=`<label for="m${i}">${NAMES[i-1]}</label>
    <input id="m${i}" type="text" inputmode="decimal" autocomplete="off" placeholder="000000">
    <div class="prev" id="p${i}"></div>`;
  metersEl.appendChild(d);
}
["phone","email","sign"].forEach(k=>{const v=store.get(k,null);if(v!==null)$(k).value=v;
  $(k).addEventListener("input",()=>{store.set(k,$(k).value.trim());render()})});


const num=s=>{const n=parseFloat(String(s).replace(/\s/g,"").replace(",","."));return isNaN(n)?null:n};
const fmt=n=>n.toLocaleString("nb-NO",{maximumFractionDigits:1});
const vals=()=>[1,2,3].map(i=>$("m"+i).value.trim());

function text(){
  const v=vals();
  const lines=NAMES.map((n,i)=>`${n}: ${v[i]?v[i]+" kWh":"–"}`).join("\n");
  return `Hei Asbjørn, her er måleravlesningen for denne måneden:\n${lines}\nMvh ${$("sign").value.trim()||"Philip"}`;
}
function render(){
  const v=vals();
  for(let i=0;i<3;i++){
    const p=$("p"+(i+1));
    if(last&&last.vals[i]){
      const a=num(last.vals[i]),b=num(v[i]);
      const diff=(a!==null&&b!==null)?`<span>Forbruk: <b>${fmt(b-a)} kWh</b></span>`:"";
      p.innerHTML=`<span>Forrige (${last.date}): ${last.vals[i]}</span>${diff}`;
    } else p.textContent="";
  }
  $("preview").textContent=text();
  const mon=new Date().toLocaleDateString("nb-NO",{month:"long"});
  $("mail").href="mailto:"+$("email").value.trim()+"?subject="+encodeURIComponent("Måler "+mon)+"&body="+encodeURIComponent(text());
  $("gweb").href="https://mail.google.com/mail/?view=cm&fs=1&to="+encodeURIComponent($("email").value.trim())+"&su="+encodeURIComponent("Måler "+mon)+"&body="+encodeURIComponent(text());
  $("sms").href="sms:"+$("phone").value.trim()+"?body="+encodeURIComponent(text());
}
metersEl.addEventListener("input",render);

function ready(){
  if(vals().some(x=>!x)){$("status").textContent="Fyll inn Hovedmåler, Elbil og Moddi først.";return false}
  return true;
}
function saveSent(){
  store.set("last",{date:new Date().toLocaleDateString("nb-NO"),vals:vals()});
}
$("sms").onclick=e=>{
  if(!ready()){e.preventDefault();return}
  if(!$("phone").value.trim()){e.preventDefault();$("settings").open=true;$("status").textContent="Legg inn Asbjørns mobilnummer under Innstillinger.";return}
  saveSent();
  $("status").textContent="Åpner meldingsappen. Får du ikke opp SMS, bruk «Kopier tekst».";
};
$("gweb").onclick=e=>{if(!ready()){e.preventDefault();return}saveSent()};
$("mail").onclick=e=>{
  if(!ready()){e.preventDefault();return}
  if(!$("email").value.trim()){e.preventDefault();$("settings").open=true;$("status").textContent="Legg inn e-postadressen under Innstillinger.";return}
  saveSent();
  $("status").textContent="E-posten åpnes ferdig utfylt. Trykk send der. Skjer ingenting, åpne siden i Chrome.";
};
$("copy").onclick=()=>{
  if(!ready())return;
  const t=text();
  navigator.clipboard.writeText(t).then(()=>{saveSent();$("status").textContent="Kopiert. Lim inn i en melding til Asbjørn."})
   .catch(()=>{const r=document.createRange();r.selectNodeContents($("preview"));const s=getSelection();s.removeAllRanges();s.addRange(r);
     $("status").textContent="Teksten er markert. Trykk kopier."});
};
$("reset").onclick=()=>{try{localStorage.removeItem("last")}catch(e){}location.reload()};
if(!store.get("email",null))$("settings").open=true;
render();
</script>

</body>
</html>
